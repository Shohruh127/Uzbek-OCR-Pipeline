# PaddleOCR Recognition Fine-Tuning Configuration
# Base Model: PP-OCRv4_rec (Server)
# Target: Uzbek (Cyrillic/Latin), Russian, English

Global:
  debug: false
  use_gpu: true
  epoch_num: 60
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/rec_ppocr_v4_uz
  save_epoch_step: 5
  eval_batch_step:
    - 0
    - 2000
  cal_metric_during_train: true
  pretrained_model: ./pretrain_models/PP-OCRv4_rec_server
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: doc/imgs_words/uz/
  character_dict_path: configs/uz_ru_en_dict.txt
  max_text_length: 100
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: ./output/rec/predicts_ppocr_v4_uz.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
    freeze_backbone: false
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 64
            depth: 2
            hidden_dims: 120
            use_guide: true
          Head:
            fc_decay: 0.00001
      - SARHead:
          enc_dim: 512
          max_text_length: 100

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - SARLoss:

PostProcess:
  name: CTCLabelDecode
  character_dict_path: configs/uz_ru_en_dict.txt
  use_space_char: true

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/
    ext_op_transform_idx: 1
    label_file_list:
      - ./train_data/uz_train.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.5
          ext_data_num: 2
          image_shape:
            - 48
            - 320
            - 3
          max_text_length: 100
      - RecAug:
      - MultiLabelEncode:
      - RecResizeImg:
          image_shape:
            - 3
            - 48
            - 320
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_sar
            - length
            - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 128
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/
    label_file_list:
      - ./train_data/uz_val.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
      - RecResizeImg:
          image_shape:
            - 3
            - 48
            - 320
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_sar
            - length
            - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 256
    num_workers: 4
